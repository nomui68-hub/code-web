<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện tập Đơn điệu – Cực trị</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{background:var(--accent);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px}
header h1{margin:0;font-size:1.3rem}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.name{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.name input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1rem}
h2{font-size:1.05rem;margin:24px 0 8px;color:var(--accent)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q .stem{margin-bottom:8px}
.q .stem b{color:var(--accent)}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.opts label:hover{background:#eef2ff}
.ds{width:100%;border-collapse:collapse;margin-top:4px}
.ds td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.ds td.c{width:64px;text-align:center}
.short input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:1rem;width:160px}
.fb{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.95rem}
.fb.ok{display:block;background:var(--okbg);color:var(--ok)}
.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.right{background:var(--okbg)!important}
.wrong{background:var(--badbg)!important}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
button.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
#result{display:none;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:16px;text-align:center}
#result .score{font-size:2rem;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Luyện tập: Tính đơn điệu và cực trị của hàm số</h1>
  <p>Toán 12 – Kết nối tri thức · 6 câu trắc nghiệm, 1 câu Đúng/Sai, 2 câu trả lời ngắn · Thang điểm 10</p>
</header>

<div class="name"><label for="hs">Họ tên – Lớp:</label><input id="hs" placeholder="VD: Nguyễn Văn A – 12A1"></div>

<form id="quiz" onsubmit="return false">
<h2>PHẦN I. Trắc nghiệm nhiều lựa chọn (mỗi câu 0,75 điểm)</h2>
<div id="p1"></div>
<h2>PHẦN II. Trắc nghiệm Đúng/Sai (2,5 điểm)</h2>
<div id="p2"></div>
<h2>PHẦN III. Trả lời ngắn (mỗi câu 1,5 điểm)</h2>
<div id="p3"></div>
</form>

<div class="bar">
  <button id="btnSubmit" type="button">Nộp bài</button>
  <button id="btnRetry" class="sec" type="button">Làm lại</button>
</div>
<div id="result"><div id="who"></div><div class="score" id="score"></div><div id="detail"></div></div>
</div>

<script>
const P1 = [
  {q:"Hàm số $y=x^3-3x+2$ đồng biến trên khoảng nào dưới đây?",
   o:["$(-1;1)$","$(1;+\\infty)$","$(-\\infty;1)$","$(0;2)$"],a:1,
   g:"$y'=3x^2-3>0 \\Leftrightarrow x<-1$ hoặc $x>1$. Vậy hàm số đồng biến trên $(1;+\\infty)$."},
  {q:"Điểm cực đại của hàm số $y=-x^3+3x^2+1$ là",
   o:["$x=0$","$x=2$","$x=1$","$x=-2$"],a:1,
   g:"$y'=-3x^2+6x=0\\Leftrightarrow x=0$ hoặc $x=2$. $y'$ đổi dấu từ $+$ sang $-$ khi qua $x=2$ nên $x=2$ là điểm cực đại."},
  {q:"Hàm số $y=x^4-2x^2+3$ có bao nhiêu điểm cực trị?",
   o:["$0$","$1$","$2$","$3$"],a:3,
   g:"$y'=4x^3-4x=4x(x^2-1)=0$ có 3 nghiệm đơn $x=0,\\ x=\\pm1$ nên hàm số có 3 điểm cực trị."},
  {q:"Khẳng định nào sau đây đúng về hàm số $y=\\dfrac{x-1}{x+1}$?",
   o:["Nghịch biến trên $\\mathbb{R}\\setminus\\{-1\\}$","Đồng biến trên $\\mathbb{R}$","Đồng biến trên mỗi khoảng $(-\\infty;-1)$ và $(-1;+\\infty)$","Nghịch biến trên mỗi khoảng $(-\\infty;-1)$ và $(-1;+\\infty)$"],a:2,
   g:"$y'=\\dfrac{2}{(x+1)^2}>0$ với mọi $x\\ne-1$ nên hàm số đồng biến trên từng khoảng xác định."},
  {q:"Giá trị cực tiểu của hàm số $y=x^3-3x^2+4$ là",
   o:["$y_{CT}=4$","$y_{CT}=0$","$y_{CT}=2$","$y_{CT}=-4$"],a:1,
   g:"$y'=3x^2-6x=0\\Leftrightarrow x=0$ hoặc $x=2$. Hàm số đạt cực tiểu tại $x=2$, $y_{CT}=y(2)=8-12+4=0$."},
  {q:"Cho hàm số $f(x)$ có đạo hàm $f'(x)=(x-1)^2(x+2)$. Số điểm cực trị của $f(x)$ là",
   o:["$0$","$1$","$2$","$3$"],a:1,
   g:"$f'(x)$ chỉ đổi dấu khi qua $x=-2$ (nghiệm đơn); qua $x=1$ (nghiệm kép) không đổi dấu. Vậy có 1 điểm cực trị."}
];
const P2 = {stem:"Cho hàm số $y=x^3-6x^2+9x-1$. Xét tính đúng/sai của các khẳng định sau:",
  items:[
   {s:"a) Đạo hàm $y'=3x^2-12x+9$.",a:true,g:"Đúng."},
   {s:"b) Hàm số nghịch biến trên khoảng $(1;3)$.",a:true,g:"Đúng: $y'=3(x-1)(x-3)<0$ khi $1<x<3$."},
   {s:"c) Hàm số đạt cực đại tại $x=3$.",a:false,g:"Sai: hàm số đạt cực đại tại $x=1$, cực tiểu tại $x=3$."},
   {s:"d) $y_{CĐ}-y_{CT}=4$.",a:true,g:"Đúng: $y_{CĐ}=y(1)=3$, $y_{CT}=y(3)=-1$, hiệu bằng $4$."}
  ]};
const P3 = [
  {q:"Tính tổng giá trị cực đại và giá trị cực tiểu của hàm số $y=x^3-3x^2-9x+5$.",a:-12,
   g:"$y'=3x^2-6x-9=0\\Leftrightarrow x=-1$ hoặc $x=3$. $y(-1)=10$, $y(3)=-22$. Tổng: $-12$."},
  {q:"Có bao nhiêu giá trị nguyên của tham số $m$ để hàm số $y=\\dfrac13x^3-mx^2+4x+1$ đồng biến trên $\\mathbb{R}$?",a:5,
   g:"$y'=x^2-2mx+4\\ge0\\ \\forall x \\Leftrightarrow \\Delta'=m^2-4\\le0\\Leftrightarrow -2\\le m\\le2$. Có 5 giá trị nguyên."}
];
const L="ABCD";
function build(){
  document.getElementById('p1').innerHTML = P1.map((c,i)=>`
   <div class="q"><div class="stem"><b>Câu ${i+1}.</b> ${c.q}</div>
   <div class="opts">${c.o.map((o,j)=>`<label id="l${i}_${j}"><input type="radio" name="c${i}" value="${j}"> <span><b>${L[j]}.</b> ${o}</span></label>`).join('')}</div>
   <div class="fb" id="f1_${i}"></div></div>`).join('');
  document.getElementById('p2').innerHTML = `<div class="q"><div class="stem"><b>Câu 7.</b> ${P2.stem}</div>
   <table class="ds"><tr><td></td><td class="c"><b>Đúng</b></td><td class="c"><b>Sai</b></td></tr>
   ${P2.items.map((it,k)=>`<tr id="r${k}"><td>${it.s}<div class="fb" id="f2_${k}"></div></td>
     <td class="c"><input type="radio" name="d${k}" value="1" aria-label="Đúng"></td>
     <td class="c"><input type="radio" name="d${k}" value="0" aria-label="Sai"></td></tr>`).join('')}</table></div>`;
  document.getElementById('p3').innerHTML = P3.map((c,i)=>`
   <div class="q"><div class="stem"><b>Câu ${8+i}.</b> ${c.q}</div>
   <div class="short">Đáp số: <input id="s${i}" inputmode="decimal" placeholder="Nhập số"></div>
   <div class="fb" id="f3_${i}"></div></div>`).join('');
  if (window.renderMathInElement) renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:false}]});
}
function fb(id,ok,text){const e=document.getElementById(id);e.className='fb '+(ok?'ok':'bad');e.innerHTML=(ok?'✔ ':'✘ ')+text;}
function grade(){
  let s1=0,s2=0,s3=0,n2=0;
  P1.forEach((c,i)=>{
    const v=document.querySelector(`input[name=c${i}]:checked`);
    const ok=v&&+v.value===c.a; if(ok)s1+=0.75;
    document.getElementById(`l${i}_${c.a}`).classList.add('right');
    if(v&&!ok)document.getElementById(`l${i}_${v.value}`).classList.add('wrong');
    fb(`f1_${i}`,ok,(ok?'Chính xác. ':`Đáp án đúng: ${L[c.a]}. `)+c.g);
  });
  P2.items.forEach((it,k)=>{
    const v=document.querySelector(`input[name=d${k}]:checked`);
    const ok=v&&(v.value==='1')===it.a; if(ok)n2++;
    fb(`f2_${k}`,ok,it.g);
  });
  s2=[0,0.25,0.625,1.25,2.5][n2];
  P3.forEach((c,i)=>{
    const raw=document.getElementById(`s${i}`).value.trim().replace(',','.');
    const ok=raw!==''&&Math.abs(parseFloat(raw)-c.a)<1e-9; if(ok)s3+=1.5;
    fb(`f3_${i}`,ok,(ok?'Chính xác. ':`Đáp số đúng: ${c.a}. `)+c.g);
  });
  const t=s1+s2+s3;
  if (window.renderMathInElement) renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:false}]});
  const r=document.getElementById('result'); r.style.display='block';
  const name=document.getElementById('hs').value.trim();
  document.getElementById('who').textContent=name?('Học sinh: '+name):'';
  document.getElementById('score').textContent=t.toFixed(2).replace('.',',')+' / 10';
  document.getElementById('detail').textContent=`Phần I: ${s1.toFixed(2)} · Phần II: ${s2.toFixed(3).replace(/0$/,'')} (đúng ${n2}/4 ý) · Phần III: ${s3.toFixed(1)}`;
  document.querySelectorAll('#quiz input').forEach(e=>e.disabled=true);
  document.getElementById('btnSubmit').disabled=true;
  r.scrollIntoView({behavior:'smooth'});
}
function retry(){
  build(); document.getElementById('result').style.display='none';
  document.getElementById('btnSubmit').disabled=false; window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('btnSubmit').onclick=()=>{
  const blank=document.querySelectorAll('#p1 input:checked').length<P1.length;
  if(blank && !confirm('Còn câu chưa làm. Vẫn nộp bài?')) return;
  grade();
};
document.getElementById('btnRetry').onclick=retry;
window.addEventListener('DOMContentLoaded',build);
</script>
</body>
</html>
